# =============================================================
#  triggers.yaml  —  Tool Request Configuration
#  Edit this file only. No code changes needed.
# =============================================================

# Phrases that must be spoken BEFORE a tool name to form a valid request.
# These are matched as substrings, so multi-word phrases work fine.
command_phrases:
  - "hand me"
  - "give me"
  - "get me"
  - "retrieve"
  - "grab"

# Phrases that trigger a "go home" / reset request. Matched as substrings
# anywhere in the utterance. Published on /voice_command/home_request.
home_phrases:
  - "go home"
  - "home position"
  - "initial position"
  - "reset position"
  - "return home"

# Tool names and their associated AprilTag IDs (tag36h11).
# The tool word must appear AFTER the command phrase in the utterance.
tools:
  hammer:                3
  phillips screwdriver:  2
  flathead screwdriver:  4
  phillips:              2
  flathead:              4
